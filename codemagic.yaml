workflows:
  zadi-android-apk:
    name: زادي - بناء APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      vars:
        EXPO_TOKEN: $EXPO_TOKEN
    scripts:
      - name: تنظيف الكاش قبل التثبيت
        script: |
          npm cache clean --force
          rm -rf node_modules/.expo
      - name: تثبيت الحزم
        script: npm install
      - name: توحيد نسخ حزم Expo (يمنع تعارض إصدارات Gradle)
        script: npx expo install --fix
      - name: تثبيت EAS CLI
        script: npm install -g eas-cli
      - name: بناء APK عبر EAS
        script: eas build --platform android --profile preview --non-interactive --clear-cache
    artifacts:
      - "*.apk"
